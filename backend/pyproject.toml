[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "conveditor-backend"
version = "0.1.0"
description = "动画 AI 编辑器的 FastAPI 后端骨架"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "openai>=1.68",
    "pydantic-settings>=2.8",
    "pillow>=11.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
